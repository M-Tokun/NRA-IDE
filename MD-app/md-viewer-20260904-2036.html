<html lang="ja">
<head>
<meta charset="utf-8">

<title>Markdown Viewer</title>

<link id="hljs-light" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<link id="hljs-dark"  rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" disabled>

<style>
:root{
  --bg:#ffffff; --bg-soft:#f6f8fa; --fg:#1f2328; --fg-muted:#59636e;
  --line:#d1d9e0; --link:#0969da; --accent:#1a7f37; --code-bg:#f6f8fa;
  --quote:#59636e; --quote-line:#d1d9e0; --mark:#fff8c5;
  --sidebar-w:264px; --header-h:46px;
}
:root[data-theme="dark"]{
  --bg:#0d1117; --bg-soft:#161b22; --fg:#e6edf3; --fg-muted:#9198a1;
  --line:#30363d; --link:#4493f8; --accent:#3fb950; --code-bg:#161b22;
  --quote:#9198a1; --quote-line:#30363d; --mark:#3b2e00;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP","Segoe UI",Meiryo,sans-serif;
  font-size:16px; line-height:1.7;
}
button,select,input{font:inherit;color:inherit}
/* ---------- header ---------- */
header{
  position:fixed; inset:0 0 auto 0; height:var(--header-h); z-index:20;
  display:flex; align-items:center; gap:8px; padding:0 12px;
  background:var(--bg-soft); border-bottom:1px solid var(--line);
}
header .name{font-weight:600;font-size:14px;margin-right:4px;white-space:nowrap}
header .spacer{flex:1}
.btn{
  background:var(--bg); border:1px solid var(--line); border-radius:6px;
  padding:5px 10px; font-size:13px; cursor:pointer; white-space:nowrap;
}
.btn:hover{background:var(--line)}
.btn:focus-visible,a:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.btn[aria-pressed="true"]{background:var(--link);border-color:var(--link);color:#fff}
/* ---------- layout ---------- */
main{display:flex; padding-top:var(--header-h); height:100%}
aside{
  width:var(--sidebar-w); flex:0 0 var(--sidebar-w); border-right:1px solid var(--line);
  background:var(--bg-soft); overflow-y:auto; height:calc(100vh - var(--header-h));
  position:sticky; top:var(--header-h);
}
aside.hidden{display:none}
.side-sec{padding:10px 12px;border-bottom:1px solid var(--line)}
.side-sec h2{font-size:11px;letter-spacing:.04em;color:var(--fg-muted);margin:0 0 6px;font-weight:600}
.side-sec ul{list-style:none;margin:0;padding:0}
.side-sec li a{
  display:block;padding:3px 6px;border-radius:5px;font-size:13px;color:var(--fg);
  text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.side-sec li a:hover{background:var(--line)}
.side-sec li a.current{background:var(--line);font-weight:600}
.toc .lv3{padding-left:14px}.toc .lv4{padding-left:28px}
.toc .lv5,.toc .lv6{padding-left:40px}
#pane{flex:1;min-width:0;display:flex;height:calc(100vh - var(--header-h))}
#editor{
  display:none; width:44%; border-right:1px solid var(--line); resize:none; padding:14px;
  font-family:ui-monospace,SFMono-Regular,Consolas,"Noto Sans Mono",monospace;
  font-size:13.5px; line-height:1.6; background:var(--bg); border-top:0;border-left:0;border-bottom:0;
}
#editor.on{display:block}
#viewport{flex:1;min-width:0;overflow-y:auto;padding:28px 32px 120px}
#doc{max-width:76ch;margin:0 auto}
.drop{
  border:1px dashed var(--line); border-radius:10px; padding:40px 24px; text-align:center; color:var(--fg-muted);
}
.drop strong{display:block;color:var(--fg);font-size:15px;margin-bottom:6px}
body.dragging #viewport{outline:2px dashed var(--link); outline-offset:-10px}
/* ---------- markdown body ---------- */
#doc h1,#doc h2,#doc h3,#doc h4,#doc h5,#doc h6{line-height:1.35;margin:1.6em 0 .6em;font-weight:600;scroll-margin-top:calc(var(--header-h) + 12px)}
#doc h1{font-size:1.9em;padding-bottom:.3em;border-bottom:1px solid var(--line);margin-top:0}
#doc h2{font-size:1.45em;padding-bottom:.3em;border-bottom:1px solid var(--line)}
#doc h3{font-size:1.2em}#doc h4{font-size:1em}#doc h5{font-size:.9em}#doc h6{font-size:.85em;color:var(--fg-muted)}
#doc p,#doc ul,#doc ol,#doc dl{margin:0 0 1em}
#doc li{margin:.25em 0}
#doc li>ul,#doc li>ol{margin:.25em 0}
#doc a{color:var(--link);text-decoration:none}
#doc a:hover{text-decoration:underline}
#doc .anchor{opacity:0;margin-left:.3em;font-size:.8em;text-decoration:none}
#doc h1:hover .anchor,#doc h2:hover .anchor,#doc h3:hover .anchor,
#doc h4:hover .anchor,#doc h5:hover .anchor,#doc h6:hover .anchor{opacity:.6}
#doc blockquote{margin:0 0 1em;padding:.1em 1em;color:var(--quote);border-left:.25em solid var(--quote-line)}
#doc code{font-family:ui-monospace,SFMono-Regular,Consolas,"Noto Sans Mono",monospace;font-size:.88em}
#doc :not(pre)>code{background:var(--code-bg);padding:.2em .4em;border-radius:6px}
#doc pre{position:relative;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:14px 16px;overflow:auto;margin:0 0 1em}
#doc pre code{background:none;padding:0;font-size:.86em;line-height:1.55}
#doc pre .copy{position:absolute;top:6px;right:6px;opacity:0;transition:opacity .12s}
#doc pre:hover .copy,#doc pre .copy:focus-visible{opacity:1}
#doc table{border-collapse:collapse;display:block;overflow:auto;margin:0 0 1em;max-width:100%}
#doc th,#doc td{border:1px solid var(--line);padding:6px 13px}
#doc thead th{background:var(--bg-soft)}
#doc tbody tr:nth-child(2n){background:var(--bg-soft)}
#doc img{max-width:100%;background:var(--bg)}
#doc hr{height:1px;border:0;background:var(--line);margin:1.8em 0}
#doc .task-list-item{list-style:none}
#doc .task-list-item input{margin:0 .4em 0 -1.4em;vertical-align:middle}
#doc ul.contains-task-list{padding-left:1.6em}
#doc mark{background:var(--mark);color:inherit}
#doc .frontmatter{background:var(--bg-soft);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:0 0 1.4em;font-size:.85em;color:var(--fg-muted);white-space:pre-wrap;font-family:ui-monospace,monospace}
#doc .mermaid{margin:0 0 1em;text-align:center}
#doc .katex-display{overflow-x:auto;overflow-y:hidden;padding:2px 0}
#doc .err{border:1px solid #cf222e;border-radius:6px;padding:8px 12px;color:#cf222e;font-size:.85em}
/* ---------- responsive / print ---------- */
@media (max-width:820px){
  :root{--sidebar-w:210px}
  aside{position:fixed;left:0;top:var(--header-h);z-index:15}
  #viewport{padding:20px 16px 100px}
  #editor.on{width:100%;display:none}
}
@media print{
  header,aside,#editor{display:none!important}
  #viewport{overflow:visible;padding:0;height:auto}
  main{padding:0;display:block}
  #doc{max-width:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <span class="name" id="fname">Markdown Viewer</span>
  <button class="btn" id="btn-file">ファイルを開く</button>
  <button class="btn" id="btn-dir">フォルダを開く</button>
  <button class="btn" id="btn-edit" aria-pressed="false">編集</button>
  <span class="spacer"></span>
  <button class="btn" id="btn-side" aria-pressed="true">サイドバー</button>
  <button class="btn" id="btn-theme">ダーク</button>
  <button class="btn" id="btn-save">HTML 保存</button>
  <button class="btn" id="btn-print">印刷</button>
</header>

<main>
  <aside id="sidebar">
    <div class="side-sec" id="filesec" hidden>
      <h2>ファイル</h2>
      <ul id="filelist"></ul>
    </div>
    <div class="side-sec">
      <h2>目次</h2>
      <ul id="toc" class="toc"></ul>
    </div>
  </aside>

  <div id="pane">
    <textarea id="editor" spellcheck="false" placeholder="ここに Markdown を書くと右側に反映されます。"></textarea>
    <div id="viewport"><div id="doc"></div></div>
  </div>
</main>

<input type="file" id="in-file" accept=".md,.markdown,.mdown,.mkd,.txt" hidden>
<input type="file" id="in-dir" webkitdirectory directory multiple hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.0/mermaid.min.js"></script>

<script>
"use strict";
(function () {
  /* ============ 要素 ============ */
  const $ = (id) => document.getElementById(id);
  const doc = $("doc"), viewport = $("viewport"), editor = $("editor");
  const tocEl = $("toc"), fileListEl = $("filelist"), fileSec = $("filesec");
  const fnameEl = $("fname");

  /* ============ 状態 ============ */
  let assets = new Map();   // 相対パス -> blob URL（画像など）
  let mdFiles = new Map();  // 相対パス -> File（.md）
  let currentPath = "";
  let rawText = "";

  /* ============ ライブラリ初期化（欠落しても落とさない） ============ */
  const hasMarked = typeof marked !== "undefined";
  const hasPurify = typeof DOMPurify !== "undefined";
  const hasHljs   = typeof hljs !== "undefined";
  const hasKatex  = typeof katex !== "undefined";
  const hasMermaid= typeof mermaid !== "undefined";

  if (hasMarked) {
    marked.setOptions({ gfm: true, breaks: false, pedantic: false });
  }
  if (hasMermaid) {
    try { mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: "default" }); }
    catch (e) { console.warn(e); }
  }

  /* ============ 数式・コードの保護 ============ */
  // marked が数式内の _ や * を解釈しないよう、先に退避します。
  function protect(src) {
    const code = [], math = [];
    let s = src;

    // 1) 코드: fenced → inline の順で退避
    s = s.replace(/^([ \t]*)(`{3,}|~{3,})([^\n]*)\n[\s\S]*?^[ \t]*\2[ \t]*$/gm, (m) => {
      code.push(m); return "%%%CODE" + (code.length - 1) + "%%%";
    });
    s = s.replace(/(`+)(?:(?!\1)[\s\S])*?\1/g, (m) => {
      code.push(m); return "%%%CODE" + (code.length - 1) + "%%%";
    });

    // 2) 数式: $$...$$ / \[...\] / $...$ / \(...\)
    s = s.replace(/\$\$([\s\S]+?)\$\$/g, (m, x) => {
      math.push({ tex: x, display: true }); return "%%%MATH" + (math.length - 1) + "%%%";
    });
    s = s.replace(/\\\[([\s\S]+?)\\\]/g, (m, x) => {
      math.push({ tex: x, display: true }); return "%%%MATH" + (math.length - 1) + "%%%";
    });
    s = s.replace(/(^|[^\\$])\$(?!\s)((?:[^$\n\\]|\\.)+?)(?<!\s)\$(?!\$)/g, (m, pre, x) => {
      math.push({ tex: x, display: false }); return pre + "%%%MATH" + (math.length - 1) + "%%%";
    });
    s = s.replace(/\\\(([\s\S]+?)\\\)/g, (m, x) => {
      math.push({ tex: x, display: false }); return "%%%MATH" + (math.length - 1) + "%%%";
    });

    // 3) コードを戻す
    s = s.replace(/%%%CODE(\d+)%%%/g, (m, i) => code[Number(i)] ?? m);
    return { text: s, math };
  }

  // 描画済み DOM のテキストノードを走査して KaTeX に差し替えます。
  function renderMath(root, math) {
    if (!math.length) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    const targets = [];
    while (walker.nextNode()) {
      const n = walker.currentNode;
      if (n.nodeValue.indexOf("%%%MATH") >= 0 && !n.parentElement.closest("pre,code")) targets.push(n);
    }
    targets.forEach((node) => {
      const frag = document.createDocumentFragment();
      let last = 0;
      const re = /%%%MATH(\d+)%%%/g; let m;
      while ((m = re.exec(node.nodeValue))) {
        if (m.index > last) frag.appendChild(document.createTextNode(node.nodeValue.slice(last, m.index)));
        const item = math[Number(m[1])];
        const span = document.createElement("span");
        if (item && hasKatex) {
          try {
            katex.render(item.tex, span, { displayMode: item.display, throwOnError: false, output: "html" });
          } catch (e) { span.className = "err"; span.textContent = "数式エラー: " + item.tex; }
        } else if (item) {
          span.textContent = (item.display ? "$$" : "$") + item.tex + (item.display ? "$$" : "$");
        }
        frag.appendChild(span);
        last = m.index + m[0].length;
      }
      if (last < node.nodeValue.length) frag.appendChild(document.createTextNode(node.nodeValue.slice(last)));
      node.parentNode.replaceChild(frag, node);
    });
  }

  /* ============ 見出し ID（GitHub 風 slug） ============ */
  const slugCount = new Map();
  function slugify(text) {
    let s = text.trim().toLowerCase()
      .replace(/[\s\u3000]+/g, "-")
      .replace(/[!-\/:-@\[-`{-~。、「」『』（）]/g, "");
    if (!s) s = "section";
    const n = slugCount.get(s) || 0;
    slugCount.set(s, n + 1);
    return n ? s + "-" + n : s;
  }

  /* ============ パス解決 ============ */
  function resolvePath(base, rel) {
    if (/^([a-z]+:)?\/\//i.test(rel) || rel.startsWith("data:") || rel.startsWith("#")) return null;
    const baseDir = base.includes("/") ? base.slice(0, base.lastIndexOf("/")) : "";
    const parts = (baseDir ? baseDir.split("/") : []);
    rel.split("/").forEach((p) => {
      if (p === "." || p === "") return;
      if (p === "..") parts.pop(); else parts.push(p);
    });
    return parts.join("/");
  }

  /* ============ 本体レンダリング ============ */
  function render(src, path) {
    rawText = src; currentPath = path || currentPath;
    slugCount.clear();

    // front matter
    let fm = "";
    let body = src.replace(/^\uFEFF/, "");
    const fmMatch = body.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
    if (fmMatch) { fm = fmMatch[1]; body = body.slice(fmMatch[0].length); }

    if (!hasMarked) {
      doc.innerHTML = '<p class="err">marked を読み込めませんでした。ネットワーク接続を確認してください。</p>';
      return;
    }

    const { text, math } = protect(body);
    let html = "";
    try { html = marked.parse(text); }
    catch (e) { doc.innerHTML = '<p class="err">解析エラー: ' + String(e.message || e) + "</p>"; return; }

    if (hasPurify) {
      html = DOMPurify.sanitize(html, { USE_PROFILES: { html: true, svg: true, mathMl: true } });
    }

    doc.innerHTML = (fm ? '<div class="frontmatter"></div>' : "") + html;
    if (fm) doc.querySelector(".frontmatter").textContent = fm;

    renderMath(doc, math);
    decorate();
    buildToc();
    if (fileListEl) markCurrentFile();
    viewport.scrollTop = 0;
  }

  /* ============ 後処理（見出し ID・コード・画像・リンク・Mermaid） ============ */
  function decorate() {
    // 見出し
    doc.querySelectorAll("h1,h2,h3,h4,h5,h6").forEach((h) => {
      if (!h.id) h.id = slugify(h.textContent);
      const a = document.createElement("a");
      a.className = "anchor"; a.href = "#" + h.id; a.textContent = "#";
      a.setAttribute("aria-label", "この見出しへのリンク");
      h.appendChild(a);
    });

    // Mermaid
    doc.querySelectorAll("pre > code.language-mermaid, pre > code.lang-mermaid").forEach((code, i) => {
      const pre = code.parentElement;
      const div = document.createElement("div");
      div.className = "mermaid";
      const srcText = code.textContent;
      pre.replaceWith(div);
      if (!hasMermaid) { div.textContent = srcText; return; }
      try {
        mermaid.render("mmd-" + Date.now() + "-" + i, srcText).then(({ svg }) => {
          div.innerHTML = hasPurify ? DOMPurify.sanitize(svg, { USE_PROFILES: { svg: true, html: true } }) : svg;
        }).catch(() => { div.className = "err"; div.textContent = "Mermaid の描画に失敗しました。"; });
      } catch (e) { div.className = "err"; div.textContent = "Mermaid の描画に失敗しました。"; }
    });

    // シンタックスハイライト＋コピー
    doc.querySelectorAll("pre > code").forEach((code) => {
      if (hasHljs) { try { hljs.highlightElement(code); } catch (e) { /* noop */ } }
      const btn = document.createElement("button");
      btn.className = "btn copy"; btn.type = "button"; btn.textContent = "コピー";
      btn.addEventListener("click", async () => {
        try { await navigator.clipboard.writeText(code.textContent); btn.textContent = "コピーしました"; }
        catch (e) { btn.textContent = "コピーできません"; }
        setTimeout(() => (btn.textContent = "コピー"), 1400);
      });
      code.parentElement.appendChild(btn);
    });

    // 画像（フォルダを開いた場合は相対パスを解決）
    doc.querySelectorAll("img[src]").forEach((img) => {
      const key = resolvePath(currentPath, img.getAttribute("src"));
      if (key && assets.has(key)) img.src = assets.get(key);
      img.loading = "lazy";
    });

    // リンク（同フォルダ内の .md は内部遷移、外部は新規タブ）
    doc.querySelectorAll("a[href]").forEach((a) => {
      const href = a.getAttribute("href");
      if (!href || href.startsWith("#")) return;
      if (/^([a-z]+:)?\/\//i.test(href)) { a.target = "_blank"; a.rel = "noopener noreferrer"; return; }
      const key = resolvePath(currentPath, href.split("#")[0]);
      if (key && mdFiles.has(key)) {
        a.addEventListener("click", (ev) => { ev.preventDefault(); openFile(mdFiles.get(key), key); });
      }
    });
  }

  /* ============ 目次 ============ */
  function buildToc() {
    tocEl.innerHTML = "";
    const hs = doc.querySelectorAll("h1,h2,h3,h4,h5,h6");
    if (!hs.length) { tocEl.innerHTML = '<li style="color:var(--fg-muted);font-size:13px;padding:3px 6px">見出しがありません</li>'; return; }
    hs.forEach((h) => {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = "#" + h.id;
      a.textContent = h.textContent.replace(/#$/, "").trim();
      a.className = "lv" + h.tagName[1];
      a.addEventListener("click", (ev) => {
        ev.preventDefault();
        const t = document.getElementById(h.id);
        if (t) { viewport.scrollTo({ top: t.offsetTop - 12, behavior: "smooth" }); history.replaceState(null, "", "#" + h.id); }
      });
      li.appendChild(a); tocEl.appendChild(li);
    });
  }

  /* ============ ファイル読み込み ============ */
  function readText(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(String(r.result || ""));
      r.onerror = () => rej(new Error("読み込みに失敗しました"));
      r.readAsText(file, "utf-8");
    });
  }

  async function openFile(file, path) {
    try {
      const text = await readText(file);
      const p = path || file.webkitRelativePath || file.name;
      fnameEl.textContent = p;
      document.title = (p.split("/").pop() || "Markdown") + " — Markdown Viewer";
      editor.value = text;
      render(text, p);
    } catch (e) {
      doc.innerHTML = '<p class="err">' + String(e.message || e) + "</p>";
    }
  }

  function isMd(name) { return /\.(md|markdown|mdown|mkd|txt)$/i.test(name); }
  function isImg(name) { return /\.(png|jpe?g|gif|svg|webp|avif|bmp)$/i.test(name); }

  function loadFolder(files) {
    assets.forEach((url) => URL.revokeObjectURL(url));
    assets = new Map(); mdFiles = new Map();
    const list = Array.from(files);
    // ルート直下のフォルダ名を取り除いて相対パス化します。
    const strip = (p) => p.split("/").slice(1).join("/") || p;
    list.forEach((f) => {
      const rel = strip(f.webkitRelativePath || f.name);
      if (isMd(f.name)) mdFiles.set(rel, f);
      else if (isImg(f.name)) assets.set(rel, URL.createObjectURL(f));
    });
    renderFileList();
    const first = mdFiles.get("README.md") ? "README.md" : mdFiles.keys().next().value;
    if (first) openFile(mdFiles.get(first), first);
    else doc.innerHTML = '<p class="err">.md ファイルが見つかりませんでした。</p>';
  }

  function renderFileList() {
    fileListEl.innerHTML = "";
    if (!mdFiles.size) { fileSec.hidden = true; return; }
    fileSec.hidden = false;
    Array.from(mdFiles.keys()).sort((a, b) => a.localeCompare(b)).forEach((p) => {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = "#"; a.textContent = p; a.title = p; a.dataset.path = p;
      a.addEventListener("click", (ev) => { ev.preventDefault(); openFile(mdFiles.get(p), p); });
      li.appendChild(a); fileListEl.appendChild(li);
    });
  }

  function markCurrentFile() {
    fileListEl.querySelectorAll("a").forEach((a) => {
      a.classList.toggle("current", a.dataset.path === currentPath);
    });
  }

  /* ============ 操作 ============ */
  $("btn-file").addEventListener("click", () => $("in-file").click());
  $("in-file").addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0];
    if (f) { mdFiles = new Map(); renderFileList(); openFile(f); }
    e.target.value = "";
  });
  $("btn-dir").addEventListener("click", () => $("in-dir").click());
  $("in-dir").addEventListener("change", (e) => {
    if (e.target.files && e.target.files.length) loadFolder(e.target.files);
    e.target.value = "";
  });

  // ドラッグ＆ドロップ
  ["dragenter", "dragover"].forEach((t) => document.addEventListener(t, (e) => {
    e.preventDefault(); document.body.classList.add("dragging");
  }));
  ["dragleave", "drop"].forEach((t) => document.addEventListener(t, (e) => {
    if (t === "dragleave" && e.relatedTarget) return;
    document.body.classList.remove("dragging");
  }));
  document.addEventListener("drop", (e) => {
    e.preventDefault();
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f && isMd(f.name)) openFile(f);
  });

  // 編集モード
  $("btn-edit").addEventListener("click", (ev) => {
    const on = editor.classList.toggle("on");
    ev.currentTarget.setAttribute("aria-pressed", String(on));
    if (on) editor.focus();
  });
  let timer = null;
  editor.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(() => render(editor.value, currentPath), 220);
  });

  // サイドバー
  $("btn-side").addEventListener("click", (ev) => {
    const hidden = $("sidebar").classList.toggle("hidden");
    ev.currentTarget.setAttribute("aria-pressed", String(!hidden));
  });

  // テーマ
  function setTheme(mode) {
    document.documentElement.dataset.theme = mode;
    $("hljs-light").disabled = mode === "dark";
    $("hljs-dark").disabled = mode !== "dark";
    $("btn-theme").textContent = mode === "dark" ? "ライト" : "ダーク";
    if (hasMermaid) {
      try { mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: mode === "dark" ? "dark" : "default" }); } catch (e) {}
    }
    try { localStorage.setItem("mdviewer-theme", mode); } catch (e) {}
  }
  $("btn-theme").addEventListener("click", () => {
    setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
    if (rawText) render(rawText, currentPath);
  });
  let saved = null;
  try { saved = localStorage.getItem("mdviewer-theme"); } catch (e) {}
  setTheme(saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

  // 保存 / 印刷
  $("btn-print").addEventListener("click", () => window.print());
  $("btn-save").addEventListener("click", () => {
    const css = Array.from(document.querySelectorAll("style")).map((s) => s.textContent).join("\n");
    const links = Array.from(document.querySelectorAll('link[rel="stylesheet"]:not([disabled])'))
      .map((l) => '<link rel="stylesheet" href="' + l.href + '">').join("\n");
    const name = (currentPath.split("/").pop() || "document").replace(/\.[^.]+$/, "");
    const stamp = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 16).replace(/[-T:]/g, "").replace(/(\d{8})(\d{4})/, "$1-$2");
    const out = "<!DOCTYPE html>\n<html lang=\"ja\"><head><meta charset=\"utf-8\">"
      + "<title>" + name + "</title>" + links + "<style>" + css
      + "\nbody{padding:32px}#doc{max-width:76ch;margin:0 auto}.copy,.anchor{display:none}</style></head><body data-theme=\""
      + document.documentElement.dataset.theme + "\"><div id=\"doc\">" + doc.innerHTML + "</div></body></html>";
    const url = URL.createObjectURL(new Blob([out], { type: "text/html" }));
    const a = document.createElement("a");
    a.href = url; a.download = name + "-" + stamp + ".html";
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
  });

  /* ============ 初期表示 ============ */
  doc.innerHTML = '<div class="drop"><strong>.md ファイルをドロップしてください</strong>'
    + "ファイルまたはフォルダを開くこともできます。フォルダを開くと、相対パスの画像と .md 間リンクが解決されます。</div>";
  buildToc();
})();
</script>
</body>
</html>

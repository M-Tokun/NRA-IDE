<svg xmlns="http://www.w3.org/2000/svg" width="960" height="815" viewBox="0 0 960 815" font-family="'Yu Gothic','Meiryo','Noto Sans JP','Hiragino Sans',sans-serif">
<rect width="960" height="815" fill="#ffffff"/>
<rect x="20" y="10" width="920" height="30" rx="6" fill="#fff4cc" stroke="#d9b84a"/>
<text x="480" y="31" text-anchor="middle" font-size="16" fill="#5a4600">Fact axis: over every region (is it true? / fiction, misperception, guess)</text>
<rect x="20" y="52" width="920" height="560" rx="28" fill="#f3f6fb" stroke="#7a8aa6" stroke-width="2"/>
<text x="42" y="84" font-size="19" font-weight="bold" fill="#33415c">Existence (widest)</text>
<ellipse cx="430" cy="340" rx="300" ry="232" fill="#e6f2ea" stroke="#4f8a68" stroke-width="2.5"/>
<text x="430" y="132" text-anchor="middle" font-size="19" font-weight="bold" fill="#2f5d44">Reality</text>
<circle cx="190" cy="340" r="150" fill="#ffe3cf" fill-opacity="0.75" stroke="#c0713a" stroke-width="2.5"/>
<circle cx="430" cy="340" r="160" fill="#d9e6fb" fill-opacity="0.75" stroke="#3d68b3" stroke-width="2.5"/>
<text x="212" y="250" text-anchor="middle" font-size="19" font-weight="bold" fill="#8a4b1c">Event</text>
<text x="212" y="272" text-anchor="middle" font-size="12" fill="#8a4b1c">an occurrence cut out</text>
<text x="482" y="250" text-anchor="middle" font-size="19" font-weight="bold" fill="#264a8a">Phenomenon</text>
<text x="482" y="272" text-anchor="middle" font-size="12" fill="#264a8a">observable appearance</text>
<rect x="752" y="200" width="172" height="190" rx="14" fill="#efe6f7" stroke="#7a4fa3" stroke-width="2"/>
<text x="838" y="258" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a2c6b">Existence other</text>
<text x="838" y="278" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a2c6b">than reality</text>
<text x="838" y="312" text-anchor="middle" font-size="13" fill="#4a2c6b">numbers, averages,</text>
<text x="838" y="333" text-anchor="middle" font-size="13" fill="#4a2c6b">formulas, inferences,</text>
<text x="838" y="354" text-anchor="middle" font-size="13" fill="#4a2c6b">concepts</text>
<circle cx="320" cy="340" r="13" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="320" y="345" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">1</text>
<circle cx="170" cy="400" r="13" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="170" y="405" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">2</text>
<circle cx="530" cy="400" r="13" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="530" y="405" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">3</text>
<circle cx="80" cy="340" r="13" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="80" y="345" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">4</text>
<circle cx="838" cy="225" r="13" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="838" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">5</text>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#444"/></marker></defs>
<line x1="592" y1="340" x2="748" y2="340" stroke="#444" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="606" y="284" width="136" height="44" rx="6" fill="#ffffff" fill-opacity="0.9"/>
<text x="674" y="302" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Gate: can it be</text>
<text x="674" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">cut as a number?</text>
<rect x="606" y="350" width="136" height="38" rx="6" fill="#ffffff" fill-opacity="0.9"/>
<text x="674" y="366" text-anchor="middle" font-size="11" fill="#555">if not,</text>
<text x="674" y="381" text-anchor="middle" font-size="11" fill="#555">do not compute</text>
<rect x="20" y="626" width="920" height="178" rx="10" fill="#fafafa" stroke="#c9c9c9"/>
<text x="38" y="650" font-size="14" fill="#222">1  A real event appearing in an observable form (e.g. an earthquake)</text>
<text x="38" y="674" font-size="14" fill="#222">2  A real event not appearing in an observable form</text>
<text x="38" y="698" font-size="14" fill="#222">3  A real appearance not cut out as an event (e.g. rainbow, superconductivity, social phenomenon)</text>
<text x="38" y="722" font-size="14" fill="#222">4  An event that is not real (e.g. an event in probability theory, a fictional occurrence)</text>
<text x="38" y="746" font-size="14" fill="#222">5  Existence other than reality: a number cut from the observation of a phenomenon belongs here</text>
<text x="38" y="774" font-size="13" fill="#555">Event and phenomenon are not in an inclusion relation; they are overlapping, different views (occurrence / observable appearance).</text>
</svg>
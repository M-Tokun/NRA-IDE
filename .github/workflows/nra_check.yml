# .github/workflows/nra_check.yml
name: NRA-IDE Watchdog

on: [push]

jobs:
  check-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Tools
        # グラフを描くための道具をロボットに渡します
        run: pip install matplotlib

      - name: Energy Balance Check
        # これで「道具がない！」と怒られずに、エネルギー計算まで完遂できます
        run: python nra_ide_foundation_fixed_jp.py

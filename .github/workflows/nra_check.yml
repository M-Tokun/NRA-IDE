# 2026-03-11_0520 JST
name: NRA-IDE Watchdog
on:
  push:
  pull_request:

jobs:
  check-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install Tools
        run: pip install matplotlib

      - name: Energy Balance Check
        run: python nra-core/implementation/nra_ide_foundation_fixed_JP.py

      - name: Run Reference Conformance Tests
        run: python -m unittest tests.test_nra_ide_reference -v

      - name: Check Internal Links
        run: python scripts/check_links.py

      - name: Check Path Case Consistency
        run: python scripts/check_path_case.py

# Filename: nginx_2026-02-05_235000_HARDENED.conf
# Author: M-Tokuni | GitHub: https://github.com/M-Tokun/NRA-IDE
# Project: HAN Gate (NRA/IDE) - Nginx Integration with auth_request
# Version: 2026-02-05_235000_HARDENED
# Nginx with auth_request calling HAN Gate
# Requires: OpenResty or nginx with lua-nginx-module

worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" han_decision=$upstream_http_x_han_decision';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Hardened: Increased from 1m to 10m to prevent dictionary saturation
    lua_shared_dict han_metrics 10m;

    # Initialize metrics on worker start
    init_worker_by_lua_block {
        local metrics = ngx.shared.han_metrics
        metrics:set("retry_count", 0)
        metrics:set("timeout_count", 0)
        metrics:set("queue_depth", 0)
        metrics:set("last_update", ngx.now())
    }

    upstream upstream_backend {
        server upstream-backend:8080;
        keepalive 32;
    }

    upstream han_gate {
        server han-gate.han.svc.cluster.local:8080;
        keepalive 4;
    }

    server {
        listen 80;
        server_name _;

        # Main application route
        location /api/ {
            # HAN Gate auth check
            auth_request /_han_auth;
            auth_request_set $han_decision $upstream_http_x_han_decision;
            add_header X-HAN-Decision $han_decision;

            # Track metrics after upstream response
            log_by_lua_block {
                local metrics = ngx.shared.han_metrics
                local status = tonumber(ngx.var.status)

                -- Increment retry counter on 5xx or timeout
                if status >= 500 or status == 408 or status == 504 then
                    metrics:incr("retry_count", 1, 0)
                end

                -- Track timeouts
                if status == 504 or status == 408 then
                    metrics:incr("timeout_count", 1, 0)
                end

                -- Estimate queue depth (active connections)
                local active = ngx.var.connections_active or 0
                metrics:set("queue_depth", tonumber(active))
            }

            proxy_pass http://upstream_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Timeouts (important for HAN logic)
            proxy_connect_timeout 2s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # HAN Gate auth subrequest
        location = /_han_auth {
            internal;

            # Inject telemetry headers
            set_by_lua_block $retry_rate {
                local metrics = ngx.shared.han_metrics
                local now = ngx.now()
                local last = metrics:get("last_update") or now
                local dt = math.max(now - last, 1.0)

                local retry = metrics:get("retry_count") or 0

                -- Compute rate
                local retry_rate = retry / dt

                -- Reset counters periodically
                if dt >= 1.0 then
                    metrics:set("retry_count", 0)
                    metrics:set("timeout_count", 0)
                    metrics:set("last_update", now)
                end

                return retry_rate
            }

            set_by_lua_block $queue_depth {
                local metrics = ngx.shared.han_metrics
                return metrics:get("queue_depth") or 0
            }

            set_by_lua_block $timeout_rate {
                local metrics = ngx.shared.han_metrics
                local now = ngx.now()
                local last = metrics:get("last_update") or now
                local dt = math.max(now - last, 1.0)
                local timeout = metrics:get("timeout_count") or 0
                return timeout / dt
            }

            proxy_pass http://han_gate/v1/nginx_auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-HAN-Retry-Rate $retry_rate;
            proxy_set_header X-HAN-Queue-Depth $queue_depth;
            proxy_set_header X-HAN-Dep-Timeout-Rate $timeout_rate;

            # Fail-Closed: treat errors as deny
            proxy_connect_timeout 100ms;
            proxy_send_timeout 100ms;
            proxy_read_timeout 100ms;
        }

        # Health check
        location /healthz {
            add_header Content-Type text/plain;
            return 200 "OK\n";
        }
    }
}
